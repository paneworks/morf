[package]
name = "morf-cli"
description = "Command-line interface for morf"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "morf"
path = "src/main.rs"

[features]
default = ["kit", "a11y"]
# Surfaces' accessible trees on AT-SPI, built only while a screen reader
# asks: crates/morf-wayland/src/accesskit.rs.
a11y = ["morf-wayland/a11y"]
# luna's native Lua tier; see crates/morf-lua/src/runtime_jit.rs.
jit = ["morf-lua/jit"]
# The widget archetypes (`morf.kit.native`): crates/morf-kit.
kit = ["dep:morf-kit"]

[dependencies]
morf-value.workspace = true
libc = "0.2"
flate2.workspace = true
serde_json.workspace = true
jiff.workspace = true
morf-layout.workspace = true
morf-lua.workspace = true
morf-kit = { workspace = true, optional = true }
morf-io.workspace = true
morf-region.workspace = true
morf-render.workspace = true
morf-scene.workspace = true
morf-text.workspace = true
morf-wayland.workspace = true
pollster.workspace = true
image.workspace = true
