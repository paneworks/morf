[package]
name = "morf-lua"
description = "Sandboxed Lua configuration host for morf"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# luna's native tier (Cranelift; Linux x86-64 and aarch64). See runtime_jit.rs.
jit = ["luna/jit"]

[dependencies]
morf-value.workspace = true
jiff.workspace = true
luna.workspace = true
libc = "0.2"
morf-audio.workspace = true
morf-desktop.workspace = true
morf-image.workspace = true
morf-io.workspace = true
morf-lifecycle.workspace = true
morf-layout.workspace = true
morf-menu.workspace = true
morf-outline.workspace = true
morf-reactive.workspace = true
morf-region.workspace = true
morf-scene.workspace = true
morf-shader.workspace = true
morf-text.workspace = true
morf-services.workspace = true
morf-terminal.workspace = true
serde_json.workspace = true
pastel = "0.12"

[dev-dependencies]
image.workspace = true
