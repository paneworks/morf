[package]
name = "morf-render"
description = "GPU renderer for morf"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
morf-value.workspace = true
bytemuck.workspace = true
kurbo.workspace = true
morf-image.workspace = true
morf-layout.workspace = true
morf-vector.workspace = true
morf-scene.workspace = true
morf-text.workspace = true
raw-window-handle.workspace = true
# The dmabuf ioctls that carry a frame's fence, presenting into buffers of the
# engine's own (the window system's half is the window's `BufferSink`).
libc.workspace = true
resvg.workspace = true
wgpu.workspace = true
# The same ash wgpu-hal speaks, for the handful of Vulkan calls wgpu has no
# word for: exporting an image as a dmabuf, and acquiring it back.
ash = "0.38"

[dev-dependencies]
# The shader tests compile Lua-syntax shaders to check what the renderer
# draws with them; the renderer itself takes compiled WGSL.
morf-shader.workspace = true
pollster.workspace = true
