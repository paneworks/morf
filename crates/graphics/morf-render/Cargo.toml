[package]
name = "morf-render"
description = "GPU renderer for morf"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
morf-value.workspace = true
bytemuck.workspace = true
kurbo.workspace = true
morf-image.workspace = true
morf-layout.workspace = true
morf-vector.workspace = true
morf-scene.workspace = true
morf-shader.workspace = true
morf-text.workspace = true
raw-window-handle.workspace = true
# Presenting into buffers of the engine's own: the surface's connection, on a
# queue of this crate's, and the dmabuf ioctls that carry a frame's fence.
libc.workspace = true
wayland-backend.workspace = true
wayland-client.workspace = true
wayland-protocols.workspace = true
resvg.workspace = true
wgpu.workspace = true
# The same ash wgpu-hal speaks, for the handful of Vulkan calls wgpu has no
# word for: exporting an image as a dmabuf, and acquiring it back.
ash = "0.38"

[dev-dependencies]
pollster.workspace = true
