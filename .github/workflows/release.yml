name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  release:
    name: release ${{ matrix.artifact }}
    needs: tests
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: "morf-linux-amd64"
          - os: ubuntu-24.04-arm
            artifact: "morf-linux-arm64"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev pkg-config
      - name: Build
        run: cargo build --release --bin morf
      - name: Package
        run: |
          stage="$RUNNER_TEMP/morf-release"
          mkdir -p "$stage/library"
          cp target/release/morf "$stage/"
          cp -r library/lib library/README.md library/luarc.template.json "$stage/library/"
          "$stage/morf" types "$stage/library/types"
          tar -czf "${{ matrix.artifact }}.tar.gz" -C "$stage" morf library
      - name: Upload artifact
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: ${{ matrix.artifact }}.tar.gz
