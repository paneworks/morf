name: nix-cache

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: nix-cache
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'paneworks/morf' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
    steps:
      - name: Check publishing credentials
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          if [ -z "$CACHIX_AUTH_TOKEN" ]; then
            echo "::error::Add a paneworks cache write token as CACHIX_AUTH_TOKEN."
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866
        with:
          name: paneworks
          skipPush: true
      - name: Build engine and Lua library with install checks
        run: |
          for package in morf morf-library; do
            nix build --accept-flake-config --no-update-lock-file --print-build-logs \
              --no-link --print-out-paths ".#$package" > "$RUNNER_TEMP/$package-store-paths"
            test "$(wc -l < "$RUNNER_TEMP/$package-store-paths")" -eq 1
          done
      - name: Publish runtime closures and retain five revisions
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
          SYSTEM: ${{ matrix.system }}
        run: |
          for package in morf morf-library; do
            cachix push paneworks < "$RUNNER_TEMP/$package-store-paths"
            path=$(cat "$RUNNER_TEMP/$package-store-paths")
            cachix pin paneworks "$package-$SYSTEM" "$path" --keep-revisions 5
          done

  verify-download:
    needs: publish
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866
        with:
          name: paneworks
          skipPush: true
      - name: Download both outputs without builders and exercise Lua consumers
        run: |
          library=$(nix build --accept-flake-config --no-update-lock-file \
            --max-jobs 0 --builders '' --no-link --print-out-paths .#morf-library)
          test -d "$library/share/morf/library"
          test ! -e "$library/bin/morf"
          engine=$(nix build --accept-flake-config --no-update-lock-file \
            --max-jobs 0 --builders '' --no-link --print-out-paths .#morf)
          bash tools/nix-smoke.sh "$engine" "$library"
