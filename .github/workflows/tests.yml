name: tests

on:
  push:
    branches: [ "develop", "main" ]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      RUST_TEST_THREADS: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev pkg-config fontconfig
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-
      - name: Layer rules
        # PLAN.md sections 3 and 4: the dependency graph, Wayland and luna
        # where they may appear, files of at most 500 lines.
        run: python3 tools/layers.py --strict
      - name: Verify
        run: |
          cargo fmt --all -- --check
          cargo check --all-targets --all-features
          cargo clippy --all-targets --all-features -- -Dwarnings
          cargo test --all-targets --all-features
      - name: Widget contract
        run: |
          FONTCONFIG_FILE=$(bash tools/test-fonts.sh "$RUNNER_TEMP/morf-test-fonts")
          export FONTCONFIG_FILE
          cargo build -p morf-cli
          target/debug/morf test --no-dbus library/tests/kit_spec.lua
          target/debug/morf check --kit default --no-dbus
