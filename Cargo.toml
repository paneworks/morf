[workspace]
resolver = "2"
members = ["crates/*/*"]
# Vendored dependencies are patched sources, not members: they are neither
# linted nor tested as ours.
exclude = ["vendor"]

[workspace.package]
version = "0.2.3"
edition = "2024"
license = "MIT"
repository = "https://github.com/paneworks/morf"

[workspace.dependencies]
accesskit = "=0.25.1"
accesskit_unix = "=0.24.0"
alacritty_terminal = { version = "=0.26.0", default-features = false }
animato = { version = "=1.7.2", default-features = false, features = ["tween", "spring", "physics"] }
base64 = "=0.23.1"
bytemuck = { version = "1.25", features = ["derive"] }
cosmic-text = "=0.19.0"
jiff = "=0.2.35"
kurbo = "=0.13.1"
image = { version = "=0.25.10", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
libc = "0.2"
libloading = "0.8"
luna = { git = "https://github.com/onix-os/luna", branch = "feat/native-jit" }
pollster = "1.0"
raw-window-handle = "0.6"
resvg = { version = "=0.48.1", default-features = false, features = ["raster-images", "text", "system-fonts", "memmap-fonts"] }
rustix = { version = "1.1", features = ["event", "fs", "net", "pipe", "process", "pty", "rand", "termios"] }
slotmap = "1.0"
signed-distance-field = "=0.6.3"
swash = "=0.2.10"
serde = "1.0"
serde_json = "1.0"
flate2 = "=1.1.10"
lzma-rs = "=0.3.0"
ruzstd = "=0.9.0"
unicode-segmentation = "=1.13.3"
smithay-client-toolkit = "=0.21.1"
wayland-backend = { version = "=0.3.17", features = ["client_system", "rwh_06"] }
wayland-client = { version = "=0.31.15", features = ["system"] }
wayland-protocols = { version = "=0.32.13", features = ["client", "staging"] }
wayland-protocols-misc = { version = "=0.3.12", features = ["client"] }
wayland-protocols-wlr = { version = "=0.3.12", features = ["client"] }
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "vulkan", "gles", "wgsl"] }
xkbcommon = "=0.8.0"
zbus = "=5.19.0"
ureq = { version = "=3.4.2", default-features = false, features = ["rustls", "gzip"] }
morf-value = { path = "crates/core/morf-value" }
morf-image = { path = "crates/graphics/morf-image" }
morf-audio = { path = "crates/platform/morf-audio" }
morf-io = { path = "crates/platform/morf-io" }
morf-layout = { path = "crates/core/morf-layout" }
morf-kit = { path = "crates/engine/morf-kit" }
morf-lua = { path = "crates/engine/morf-lua" }
morf-vector = { path = "crates/graphics/morf-vector" }
morf-shader = { path = "crates/engine/morf-shader" }
morf-render = { path = "crates/graphics/morf-render" }
morf-scene = { path = "crates/core/morf-scene" }
morf-system = { path = "crates/platform/morf-system" }
morf-terminal = { path = "crates/platform/morf-terminal" }
morf-text = { path = "crates/graphics/morf-text" }
morf-app = { path = "crates/platform/morf-app" }
morf-desktop = { path = "crates/platform/morf-desktop" }
morf-runtime = { path = "crates/engine/morf-runtime" }
morf-host = { path = "crates/frontend/morf-host", default-features = false }

# cosmic-text 0.19.0 with one change: `Attrs::variations`, a variable font's
# axes beyond `wght`, reaching the shaper. Upstream shapes every face at its
# default point but for the weight, so an axis that changes advances (`opsz`,
# `wdth`) was drawn at one width and measured at another. The patch is in
# `vendor/cosmic-text` (its changes are marked `morf:`); dropping it means
# going back to measuring such axes at their defaults.
[patch.crates-io]
cosmic-text = { path = "vendor/cosmic-text" }

[profile.release]
# Speed, not size. This was `"s"`, which asks the optimiser to keep the binary
# small and gives up real throughput to do it — the wrong trade for a client
# that redraws several large outputs sixty times a second.
opt-level = 3
# Thin LTO and parallel codegen, not fat and one. Fat LTO optimises the whole
# program — every dependency included — as a single unit on essentially one
# thread, and it is the reason a release build here took minutes rather than
# the seconds the rest of it takes. It buys low single-digit percent.
#
# Thin LTO still inlines across crate boundaries, which is the part that matters
# here: the hot path runs layout into paint into the region rasteriser into
# wgpu, and none of those are the same crate.
lto = "thin"
codegen-units = 16
# The debug info goes, the function names stay: a crash report or a stack
# taken from a shell that froze says where it was, for a few MB.
strip = "debuginfo"

# What to ship. Everything above, plus the last few percent, for the one build
# an hour of linking is worth: `cargo build --profile dist`.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
